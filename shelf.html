<!doctype html>
<html lang="zh"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的书架 · EVORON AI电子书城</title>
<link rel="icon" href="/favicon.ico">
<style>
:root{--bg:#f4f5f4;--surface:#fff;--panel:#fff;--ink:#202524;--muted:#747b79;--line:#e2e5e3;--green:#079b6b;--green-dark:#087a58;--accent:#079b6b;--accent-dark:#087a58;--gold:#b27a22;--serif:'Songti SC','Noto Serif SC','Source Han Serif SC',Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--sans)}a{color:inherit;text-decoration:none}
.topbar{background:#fff;border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1180px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between}
.topbar .brand{display:inline-flex;align-items:center;gap:10px}
.topbar .brand-mark{height:32px;display:block;mix-blend-mode:multiply}
.topbar .brand-word{font-size:20px;font-weight:800;letter-spacing:.02em;background:linear-gradient(105deg,#123a8c 0%,#1f6fd6 55%,#28b4e8 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.topbar .brand-cn{font-family:var(--serif);font-size:19px;font-weight:800;letter-spacing:.14em;color:var(--ink)}
.topbar-right{display:flex;align-items:center;gap:8px}
.topbar-link{display:inline-flex;align-items:center;min-height:32px;padding:0 12px;border-radius:16px;color:var(--muted);font-size:13px;font-weight:700}
.topbar-link:hover{background:#f2f5f4;color:var(--green-dark)}
.topbar-link.active{background:#eaf4ef;color:var(--green-dark)}
.page-head{max-width:1120px;margin:0 auto;padding:36px 24px 0}
.page-head h1{margin:0;font-family:var(--serif);font-size:31px;line-height:1.4}
.page-head .lede{margin:10px 0 0;color:var(--muted);font-size:13.5px}
@media(max-width:720px){.topbar-inner{padding:0 14px}.topbar .brand-cn{display:none}.topbar-link{padding:0 9px}.page-head{padding:24px 16px 0}.page-head h1{font-size:25px}}
.m-tabbar{display:none}
@media(max-width:640px){
.topbar-link{display:none}
.m-tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:5px 8px calc(5px + env(safe-area-inset-bottom))}
.m-tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:13px;color:var(--muted);font-weight:600}
.m-tabbar a img{width:22px;height:22px;opacity:.6;mix-blend-mode:multiply}
.m-tabbar a.on{color:var(--green-dark)}
.m-tabbar a.on img{opacity:1}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
}
.wrap{max-width:1120px;margin:0 auto;padding:22px 24px 84px}
.me{color:var(--muted);font-size:13.5px;margin:0}
.sect{margin:30px 0 12px;font-family:var(--serif);font-size:19px;font-weight:800}
.sect small{color:var(--muted);font-weight:400;margin-left:8px}
/* v5.60 封面墙（用户定调：微信读书式按封面排列，不是文字列表） */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:26px 20px}
.card{display:block;min-width:0}
.card .cv{position:relative;display:block;aspect-ratio:2/3;border-radius:5px;overflow:hidden;background:#23302d;box-shadow:0 8px 20px rgba(28,38,34,.16);transition:transform .16s,box-shadow .16s}
.card .cv:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(28,38,34,.24)}
.card .cv img{width:100%;height:100%;object-fit:cover;display:block}
.card .cv .ph{position:absolute;inset:0;display:grid;place-items:center;color:#e8e2d2;font-family:var(--serif);font-size:15px;padding:12px;text-align:center;line-height:1.6}
.card .cv .done{position:absolute;top:8px;right:8px;min-height:22px;display:inline-flex;align-items:center;padding:0 8px;border-radius:11px;background:rgba(7,155,107,.92);color:#fff;font-size:11px;font-weight:800}
.card .pbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.28)}
.card .pbar i{display:block;height:100%;background:var(--green)}
.card .t{margin-top:9px;font-size:12.5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .s{margin-top:3px;color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .acts{margin-top:5px;display:flex;gap:10px}
.card .acts button{border:0;background:none;padding:0;color:var(--muted);font-size:11.5px;cursor:pointer}
.card .acts button:hover{color:var(--green-dark)}
.empty{padding:40px 0;color:var(--muted);text-align:center;font-size:14.5px;line-height:2}
.empty a{color:var(--accent)}
.nrow{display:flex;gap:10px;align-items:baseline;padding:9px 14px;margin-bottom:6px;border:1px solid var(--line);border-radius:9px;background:var(--panel);font-size:13.5px}
.nrow.unread{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.nrow .nt{color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nrow .nt b{color:var(--ink)}
.nrow a{flex:none;color:var(--accent);text-decoration:none;font-size:13px}
/* v6.9.33 笔记本（weread 式全书笔记汇总，用户拍板）：书架/笔记本双 tab，按书分组 */
.shelf-tabs{display:flex;gap:6px;margin:0 0 18px;padding:4px;border-radius:12px;background:#e9edec;width:fit-content}
.shelf-tabs button{min-height:36px;padding:0 22px;border:0;border-radius:9px;background:transparent;color:var(--muted);font:14px var(--sans);font-weight:700;cursor:pointer}
.shelf-tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(24,32,29,.1)}
.nb-book{margin-bottom:22px;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.nb-head{display:flex;align-items:baseline;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.nb-head a{font-family:var(--serif);font-size:16.5px;font-weight:800}
.nb-head a:hover{color:var(--green-dark)}
.nb-head small{color:var(--muted);font-size:13px}
.nb-item{padding:13px 18px;border-bottom:1px solid #f0f2f1}
.nb-item:last-child{border-bottom:0}
.nb-quote{margin:0;padding:2px 0 2px 12px;border-left:3px solid var(--green);font-family:var(--serif);font-size:14.5px;line-height:1.8;color:#3c443f}
.nb-text{margin:8px 0 0;font-size:13.5px;line-height:1.75;color:var(--ink)}
.nb-stars{color:var(--gold);font-size:13px;letter-spacing:1px}
.nb-meta{margin-top:7px;display:flex;gap:12px;color:var(--muted);font-size:13px}
.nb-meta button{border:0;background:none;padding:0;color:var(--muted);font-size:13px;cursor:pointer}
.nb-meta button:hover{color:#d8402a}
@media(max-width:620px){.wrap{padding:18px 14px 60px}.grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:20px 14px}.card .acts button{min-height:30px}.shelf-tabs button{padding:0 16px}}
</style></head><body>
<header class="topbar"><div class="topbar-inner"><a class="brand" href="/index.html"><img class="brand-mark" src="/brand/evoron-mark.png" alt="EVORON AI"><span class="brand-word">EVORON AI</span><span class="brand-cn">书城</span></a><span class="topbar-right"><a class="topbar-link" href="/index.html">书城首页</a><a class="topbar-link active" href="/shelf.html">我的书架</a><a class="topbar-link" href="/feed.html">社区动态</a><a class="topbar-link" href="/me.html">我的主页</a></span></div></header><nav class="m-tabbar" aria-label="站内导航"><a href="/index.html"><img src="/assets/icons/books.png" alt=""><span class="mtb-t">书城</span></a><a class="on" href="/shelf.html"><img src="/assets/icons/bookmark.png" alt=""><span class="mtb-t">书架</span></a><a href="/feed.html"><img src="/assets/icons/speech.png" alt=""><span class="mtb-t">动态</span></a><a href="/me.html"><img src="/assets/icons/person.png" alt=""><span class="mtb-t">我的</span></a></nav><script>(function(){try{if(localStorage.getItem('hai.shelfLang')==='en'){var m={'书城':'Store','书架':'Shelf','动态':'Feed','我的':'Me'};document.querySelectorAll('.m-tabbar .mtb-t').forEach(function(s){if(m[s.textContent])s.textContent=m[s.textContent]})}}catch(e){}})();</script>
<div class="page-head"><h1>我的书架</h1><p class="lede me" id="me"></p></div>
<div class="wrap">
  <nav class="shelf-tabs"><button type="button" class="on" data-stab="books">书架</button><button type="button" data-stab="notes">笔记本</button></nav>
  <div id="noti"></div>
  <div id="main"><div class="empty">正在打开书架…</div></div>
  <div id="notebook" hidden></div>
</div>
<script>
(function(){
  // v5.59.1 直取 #main（v5.59 外壳把 #me 移进 page-head，parentNode 同级假设失效=书架卡死实弹）
  var main=document.getElementById('main');
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
  function readHref(r){
    if(r.releaseId&&Number(r.chapter)>=0)return '/books/'+encodeURIComponent(r.bookId)+'/releases/'+encodeURIComponent(r.releaseId)+'/ch-'+(Number(r.chapter)+1)+'.html';
    return '/books/'+encodeURIComponent(r.bookId)+'/';
  }
  // v5.60 封面墙：书架格=封面（点击续读）+进度条+读完角标+两个小动作
  function card(r){
    var c=el('div','card');
    var cv=el('a','cv');cv.href=readHref(r);
    if(r.cover){var im=document.createElement('img');im.loading='lazy';im.src=r.cover;im.alt=r.title||'';cv.appendChild(im);}
    else{cv.appendChild(el('span','ph',r.title||'（书目已下架）'));}
    if(r.status==='finished')cv.appendChild(el('span','done','读完 ✓'));
    var pct=(r.n&&Number(r.chapter)>=0)?Math.min(100,Math.round((Number(r.chapter)+1)/r.n*100)):null;
    if(r.status==='reading'&&pct!=null){var pb=el('span','pbar');var pi=document.createElement('i');pi.style.width=pct+'%';pb.appendChild(pi);cv.appendChild(pb);}
    c.appendChild(cv);
    c.appendChild(el('div','t',r.title||'（书目已下架）'));
    var sub=r.status==='finished'?'已读完':(r.status==='wishlist'?'想读':(pct!=null?('读到 '+pct+'%'):'在读'));
    c.appendChild(el('div','s',sub+(r.updatedAt?' · '+String(r.updatedAt).slice(5,10):'')));
    var acts=el('div','acts');
    if(r.status==='reading'){var fin=el('button','','标记读完');
      fin.onclick=function(){fetch('/api/reader/shelf',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({bookId:r.bookId,title:r.title||'',status:'finished'})}).then(function(){location.reload()});};
      acts.appendChild(fin);}
    var rm=el('button','','移出');
    rm.onclick=function(){
      fetch('/api/reader/shelf',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({bookId:r.bookId,status:'remove'})})
        .then(function(x){return x.json();}).then(function(d){if(d&&d.ok)c.remove();});
    };
    acts.appendChild(rm);
    c.appendChild(acts);
    return c;
  }
  fetch('/api/reader/shelf',{credentials:'same-origin'}).then(function(r){
    if(r.status===401){main.innerHTML='';var e=el('div','empty');e.innerHTML='登录后即可使用书架，跨设备同步阅读进度。<br><a href="/index.html">回书库登录</a>';main.appendChild(e);return null;}
    return r.json();
  }).then(function(d){
    if(!d)return;
    main.innerHTML='';
    var rows=(d.rows||[]);
    if(!rows.length){var e2=el('div','empty');e2.innerHTML='书架还空着。去<a href="/index.html">书库</a>翻开一本书，读过的都会自动出现在这里。';main.appendChild(e2);return;}
    var groups=[['reading','在读'],['wishlist','想读'],['finished','读完']];
    groups.forEach(function(g){
      var list=rows.filter(function(r){return r.status===g[0];});
      if(!list.length)return;
      var h=el('div','sect',g[1]);h.appendChild(el('small','',String(list.length)+' 本'));
      main.appendChild(h);
      var grid=el('div','grid');
      list.forEach(function(r){grid.appendChild(card(r));});
      main.appendChild(grid);
    });
    fetch('/api/reader/profile',{credentials:'same-origin'}).then(function(r){return r.ok?r.json():null;}).then(function(p){
      if(p&&p.ok)document.getElementById('me').textContent=p.profile.name+' · 读完 '+p.profile.shelf.finished+' 本 · 想法 '+p.profile.notes+' 条 · 书评 '+p.profile.reviews+' 条';
    }).catch(function(){});
    // v5.8 通知箱：被回复/被赞；打开书架即视为已读（小红点熄灭）
    fetch('/api/reader/notifications',{credentials:'same-origin'}).then(function(r){return r.ok?r.json():null;}).then(function(n){
      if(!(n&&n.ok&&n.rows&&n.rows.length))return;
      var box=document.getElementById('noti');
      box.appendChild(el('div','sect','通知'));
      n.rows.slice(0,20).forEach(function(row){
        var c=el('div','nrow'+(row.read?'':' unread'));
        var t=el('span','nt');
        if(row.type==='ops'){
          // v5.53.6 运维告警（owner 专收）：直接显示告警文本
          t.innerHTML='<b></b> ⚙ '+(row.text?row.text.replace(/</g,'&lt;').slice(0,110):'');
          t.querySelector('b').textContent=row.fromName||'系统';
          c.appendChild(t);
          box.appendChild(c);
          return;
        }
        var verb=row.type==='like'?'赞了你的':'回复了你的';
        var what=row.kind==='review'?'书评':(row.kind==='reply'?'回复':'想法');
        t.innerHTML='<b></b> '+verb+what+(row.text?'：'+row.text.replace(/</g,'&lt;').slice(0,60):'');
        t.querySelector('b').textContent=row.fromName||'读者';
        c.appendChild(t);
        var a=el('a','', row.bookTitle||'去看看');
        a.href='/books/'+encodeURIComponent(row.bookId)+'/';
        c.appendChild(a);
        box.appendChild(c);
      });
      if(n.unread>0)fetch('/api/reader/notifications',{method:'POST',credentials:'same-origin'}).catch(function(){});
    }).catch(function(){});
  }).catch(function(){main.innerHTML='';main.appendChild(el('div','empty','书架暂时打不开，稍后再试。'));});
})();
</script>
<script>
/* v6.9.33 笔记本 tab（weread 式全书笔记汇总）：懒加载，按书分组渲染划线/想法/点评 */
(function(){
  var loaded=false;
  var nb=document.getElementById('notebook');
  var main=document.getElementById('main');
  var noti=document.getElementById('noti');
  if(!nb)return;
  function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  document.querySelectorAll('[data-stab]').forEach(function(tb){
    tb.addEventListener('click',function(){
      document.querySelectorAll('[data-stab]').forEach(function(x){x.classList.toggle('on',x===tb)});
      var notes=tb.dataset.stab==='notes';
      main.hidden=notes;if(noti)noti.hidden=notes;nb.hidden=!notes;
      if(notes&&!loaded){loaded=true;render()}
    });
  });
  function render(){
    nb.innerHTML='<div class="empty">正在整理笔记…</div>';
    Promise.all([
      fetch('/api/book/my-notes',{credentials:'same-origin'}).then(function(r){return r.json()}),
      fetch('/books/index.json').then(function(r){return r.json()}).catch(function(){return []})
    ]).then(function(rs){
      var d=rs[0]||{};
      if(!d.ok){nb.innerHTML='<div class="empty">登录后即可查看你的划线与想法。</div>';return}
      var map={};(rs[1]||[]).forEach(function(b){if(b)map[b.projectId||b.id]={t:b.title,u:b.url}});
      var books=d.books||[];
      if(!books.length){nb.innerHTML='<div class="empty">还没有笔记——阅读时选中文字即可划线、写想法。</div>';return}
      nb.innerHTML=books.map(function(bk){
        var m=map[bk.bookId]||{};
        var n=(bk.notes||[]).length+(bk.reviews||[]).length;
        var items='';
        (bk.notes||[]).slice().reverse().forEach(function(x){
          items+='<div class="nb-item"><p class="nb-quote">'+esc(x.quote)+'</p>'
            +(x.text?'<p class="nb-text">'+esc(x.text)+'</p>':'')
            +'<div class="nb-meta"><span>第 '+(Number(x.chapter)||1)+' 章 · '+String(x.at||'').slice(0,10)+' · '+(x.text?'想法':'划线')+'</span><button type="button" data-del="note" data-book="'+esc(bk.bookId)+'" data-id="'+esc(x.id)+'">删除</button></div></div>';
        });
        (bk.reviews||[]).forEach(function(x){
          items+='<div class="nb-item"><span class="nb-stars">'+'★★★★★'.slice(0,Math.max(1,Math.min(5,Number(x.rating)||0)))+'</span>'
            +(x.text?'<p class="nb-text">'+esc(x.text)+'</p>':'')
            +'<div class="nb-meta"><span>'+String(x.at||'').slice(0,10)+' · 点评</span><button type="button" data-del="review" data-book="'+esc(bk.bookId)+'" data-id="'+esc(x.id)+'">删除</button></div></div>';
        });
        return '<div class="nb-book"><div class="nb-head"><a href="'+esc(m.u||'#')+'">'+esc(m.t||'已下架的书')+'</a><small>'+n+' 条</small></div>'+items+'</div>';
      }).join('');
    }).catch(function(){nb.innerHTML='<div class="empty">笔记暂时打不开，稍后再试。</div>'});
  }
  nb.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('button[data-del]');
    if(!b)return;
    if(!confirm('删除这条'+(b.dataset.del==='review'?'点评':'笔记')+'？'))return;
    fetch('/api/book/delete',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({bookId:b.dataset.book,kind:b.dataset.del,id:b.dataset.id})})
      .then(function(r){return r.json()}).then(function(d){if(d&&d.ok)render()});
  });
})();
</script></body></html>
