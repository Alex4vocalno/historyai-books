<!doctype html>
<html lang="zh"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的书架 · EVORON AI电子书城</title>
<link rel="icon" href="/favicon.ico">
<style>
:root{--bg:#f4f5f4;--surface:#fff;--panel:#fff;--ink:#202524;--muted:#747b79;--line:#e2e5e3;--green:#079b6b;--green-dark:#087a58;--accent:#079b6b;--accent-dark:#087a58;--gold:#b27a22;--serif:'Songti SC','Noto Serif SC','Source Han Serif SC',Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--sans)}a{color:inherit;text-decoration:none}
.topbar{background:#fff;border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1180px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between}
.topbar .brand{display:inline-flex;align-items:center;gap:10px}
.topbar .brand-mark{height:32px;display:block;mix-blend-mode:multiply}
.topbar .brand-word{font-size:20px;font-weight:800;letter-spacing:.02em;background:linear-gradient(105deg,#123a8c 0%,#1f6fd6 55%,#28b4e8 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.topbar .brand-cn{font-family:var(--serif);font-size:19px;font-weight:800;letter-spacing:.14em;color:var(--ink)}
.topbar-right{display:flex;align-items:center;gap:8px}
.topbar-link{display:inline-flex;align-items:center;min-height:32px;padding:0 12px;border-radius:16px;color:var(--muted);font-size:13px;font-weight:700}
.topbar-link:hover{background:#f2f5f4;color:var(--green-dark)}
.topbar-link.active{background:#eaf4ef;color:var(--green-dark)}
.page-head{max-width:1120px;margin:0 auto;padding:36px 24px 0}
.page-head h1{margin:0;font-family:var(--serif);font-size:31px;line-height:1.4}
.page-head .lede{margin:10px 0 0;color:var(--muted);font-size:13.5px}
@media(max-width:720px){.topbar-inner{padding:0 14px}.topbar .brand-cn{display:none}.topbar-link{padding:0 9px}.page-head{padding:24px 16px 0}.page-head h1{font-size:25px}}
.wrap{max-width:1120px;margin:0 auto;padding:22px 24px 84px}
.me{color:var(--muted);font-size:13.5px;margin:0}
.sect{margin:30px 0 12px;font-family:var(--serif);font-size:19px;font-weight:800}
.sect small{color:var(--muted);font-weight:400;margin-left:8px}
.card{display:flex;align-items:center;gap:14px;padding:15px 17px;margin-bottom:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:0 1px 3px rgba(24,32,29,.05);transition:transform .16s,box-shadow .16s,border-color .16s}
.card:hover{transform:translateY(-2px);border-color:#b9d9cc;box-shadow:0 10px 24px rgba(24,32,29,.09)}
.card .info{min-width:0;flex:1}
.card .t{font-size:16px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .s{margin-top:4px;color:var(--muted);font-size:13px}
.card a.go{flex:none;min-height:36px;display:inline-flex;align-items:center;padding:0 16px;border:0;border-radius:18px;background:var(--accent);color:#fff;font-size:13.5px;font-weight:800;text-decoration:none}
.card button.rm{flex:none;border:0;background:none;color:var(--muted);font-size:13px;cursor:pointer}
.empty{padding:40px 0;color:var(--muted);text-align:center;font-size:14.5px;line-height:2}
.empty a{color:var(--accent)}
.nrow{display:flex;gap:10px;align-items:baseline;padding:9px 14px;margin-bottom:6px;border:1px solid var(--line);border-radius:9px;background:var(--panel);font-size:13.5px}
.nrow.unread{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.nrow .nt{color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nrow .nt b{color:var(--ink)}
.nrow a{flex:none;color:var(--accent);text-decoration:none;font-size:13px}
@media(max-width:620px){.wrap{padding:18px 14px 60px}.card{padding:13px;align-items:flex-start;flex-wrap:wrap}.card .info{flex-basis:100%}.card a.go{flex:1;justify-content:center}.card button.rm{min-height:34px}}
</style></head><body>
<header class="topbar"><div class="topbar-inner"><a class="brand" href="/index.html"><img class="brand-mark" src="/brand/evoron-mark.png" alt="EVORON AI"><span class="brand-word">EVORON AI</span><span class="brand-cn">书城</span></a><span class="topbar-right"><a class="topbar-link" href="/index.html">书城首页</a><a class="topbar-link active" href="/shelf.html">我的书架</a><a class="topbar-link" href="/feed.html">社区动态</a><a class="topbar-link" href="/me.html">我的主页</a></span></div></header>
<div class="page-head"><h1>我的书架</h1><p class="lede me" id="me"></p></div>
<div class="wrap">
  <div id="noti"></div>
  <div id="main"><div class="empty">正在打开书架…</div></div>
</div>
<script>
(function(){
  var main=document.getElementById('me').parentNode.querySelector('#main');
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
  function readHref(r){
    if(r.releaseId&&Number(r.chapter)>=0)return '/books/'+encodeURIComponent(r.bookId)+'/releases/'+encodeURIComponent(r.releaseId)+'/ch-'+(Number(r.chapter)+1)+'.html';
    return '/books/'+encodeURIComponent(r.bookId)+'/';
  }
  function card(r){
    var c=el('div','card');
    var info=el('div','info');
    info.appendChild(el('div','t',r.title||'（书目已下架）'));
    var pct=(r.n&&Number(r.chapter)>=0)?Math.min(100,Math.round((Number(r.chapter)+1)/r.n*100)):null;
    var sub=r.status==='finished'?'已读完 ✓':(r.status==='wishlist'?'想读':('读到 '+(r.chapterTitle||('第'+(Number(r.chapter)+1)+'章'))+(pct!=null?' · '+pct+'%':'')));
    info.appendChild(el('div','s',sub+(r.updatedAt?' · '+String(r.updatedAt).slice(0,10):'')));
    c.appendChild(info);
    var go=el('a','go',r.status==='wishlist'?'开始读':(r.status==='finished'?'再读':'继续读'));
    var fin=null;
    if(r.status==='reading'){fin=el('button','rm','标记读完');fin.style.color='var(--accent)';
      fin.addEventListener('click',function(ev){ev.preventDefault();ev.stopPropagation();
        fetch('/api/reader/shelf',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({bookId:r.bookId,title:r.title||'',status:'finished'})}).then(function(){location.reload()});
      });}
    go.href=readHref(r);c.appendChild(go);
    if(fin)c.appendChild(fin);
    var rm=el('button','rm','移出');
    rm.onclick=function(){
      fetch('/api/reader/shelf',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({bookId:r.bookId,status:'remove'})})
        .then(function(x){return x.json();}).then(function(d){if(d&&d.ok)c.remove();});
    };
    c.appendChild(rm);
    return c;
  }
  fetch('/api/reader/shelf',{credentials:'same-origin'}).then(function(r){
    if(r.status===401){main.innerHTML='';var e=el('div','empty');e.innerHTML='登录后即可使用书架，跨设备同步阅读进度。<br><a href="/index.html">回书库登录</a>';main.appendChild(e);return null;}
    return r.json();
  }).then(function(d){
    if(!d)return;
    main.innerHTML='';
    var rows=(d.rows||[]);
    if(!rows.length){var e2=el('div','empty');e2.innerHTML='书架还空着。去<a href="/index.html">书库</a>翻开一本书，读过的都会自动出现在这里。';main.appendChild(e2);return;}
    var groups=[['reading','在读'],['wishlist','想读'],['finished','读完']];
    groups.forEach(function(g){
      var list=rows.filter(function(r){return r.status===g[0];});
      if(!list.length)return;
      var h=el('div','sect',g[1]);h.appendChild(el('small','',String(list.length)+' 本'));
      main.appendChild(h);
      list.forEach(function(r){main.appendChild(card(r));});
    });
    fetch('/api/reader/profile',{credentials:'same-origin'}).then(function(r){return r.ok?r.json():null;}).then(function(p){
      if(p&&p.ok)document.getElementById('me').textContent=p.profile.name+' · 读完 '+p.profile.shelf.finished+' 本 · 想法 '+p.profile.notes+' 条 · 书评 '+p.profile.reviews+' 条';
    }).catch(function(){});
    // v5.8 通知箱：被回复/被赞；打开书架即视为已读（小红点熄灭）
    fetch('/api/reader/notifications',{credentials:'same-origin'}).then(function(r){return r.ok?r.json():null;}).then(function(n){
      if(!(n&&n.ok&&n.rows&&n.rows.length))return;
      var box=document.getElementById('noti');
      box.appendChild(el('div','sect','通知'));
      n.rows.slice(0,20).forEach(function(row){
        var c=el('div','nrow'+(row.read?'':' unread'));
        var t=el('span','nt');
        if(row.type==='ops'){
          // v5.53.6 运维告警（owner 专收）：直接显示告警文本
          t.innerHTML='<b></b> ⚙ '+(row.text?row.text.replace(/</g,'&lt;').slice(0,110):'');
          t.querySelector('b').textContent=row.fromName||'系统';
          c.appendChild(t);
          box.appendChild(c);
          return;
        }
        var verb=row.type==='like'?'赞了你的':'回复了你的';
        var what=row.kind==='review'?'书评':(row.kind==='reply'?'回复':'想法');
        t.innerHTML='<b></b> '+verb+what+(row.text?'：'+row.text.replace(/</g,'&lt;').slice(0,60):'');
        t.querySelector('b').textContent=row.fromName||'读者';
        c.appendChild(t);
        var a=el('a','', row.bookTitle||'去看看');
        a.href='/books/'+encodeURIComponent(row.bookId)+'/';
        c.appendChild(a);
        box.appendChild(c);
      });
      if(n.unread>0)fetch('/api/reader/notifications',{method:'POST',credentials:'same-origin'}).catch(function(){});
    }).catch(function(){});
  }).catch(function(){main.innerHTML='';main.appendChild(el('div','empty','书架暂时打不开，稍后再试。'));});
})();
</script></body></html>
