<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的主页 · EVORON AI</title>
<style>
:root{--bg:#f4f5f4;--surface:#fff;--panel:#fff;--ink:#202524;--muted:#747b79;--line:#e2e5e3;--green:#079b6b;--green-dark:#087a58;--accent:#079b6b;--accent-dark:#087a58;--gold:#b27a22;--serif:'Songti SC','Noto Serif SC','Source Han Serif SC',Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--sans)}a{color:inherit;text-decoration:none}
.topbar{background:#fff;border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1180px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between}
.topbar .brand{display:inline-flex;align-items:center;gap:10px}
.topbar .brand-mark{height:32px;display:block;mix-blend-mode:multiply}
.topbar .brand-word{font-size:20px;font-weight:800;letter-spacing:.02em;background:linear-gradient(105deg,#123a8c 0%,#1f6fd6 55%,#28b4e8 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.topbar .brand-cn{font-family:var(--serif);font-size:19px;font-weight:800;letter-spacing:.14em;color:var(--ink)}
.topbar-right{display:flex;align-items:center;gap:8px}
.topbar-link{display:inline-flex;align-items:center;min-height:32px;padding:0 12px;border-radius:16px;color:var(--muted);font-size:13px;font-weight:700}
.topbar-link:hover{background:#f2f5f4;color:var(--green-dark)}
.topbar-link.active{background:#eaf4ef;color:var(--green-dark)}
.page-head{max-width:1120px;margin:0 auto;padding:36px 24px 0}
.page-head h1{margin:0;font-family:var(--serif);font-size:31px;line-height:1.4}
.page-head .lede{margin:10px 0 0;color:var(--muted);font-size:13.5px}
@media(max-width:720px){.topbar-inner{padding:0 14px}.topbar .brand-cn{display:none}.topbar-link{padding:0 9px}.page-head{padding:24px 16px 0}.page-head h1{font-size:25px}}
.m-tabbar{display:none}
@media(min-width:641px) and (max-width:900px){.topbar .topbar-inner{height:auto;min-height:68px;flex-wrap:wrap;gap:12px;padding-top:12px;padding-bottom:12px}.topbar .topbar-right{flex-wrap:wrap}.topbar .topbar-right>.topbar-link{display:inline-flex}}
@media(max-width:640px){
.topbar-link{display:none}
.m-tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:5px 8px calc(5px + env(safe-area-inset-bottom))}
.m-tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:13px;color:var(--muted);font-weight:600}
.m-tabbar a img{width:22px;height:22px;opacity:.6;mix-blend-mode:multiply}
.m-tabbar a.on{color:var(--green-dark)}
.m-tabbar a.on img{opacity:1}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
}
.wrap{max-width:760px;margin:0 auto;padding:22px 18px 76px}
.idcard{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:14px;padding:18px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-size:22px;font-weight:800;flex:none}
.idcard .nm{font-size:18px;font-weight:800;overflow-wrap:anywhere}
.idcard .role{margin-top:3px;color:var(--muted);font-size:13px}
.idcard .go{margin-left:auto;display:flex;flex-direction:column;gap:8px}
.idcard .go a,.idcard .go button{min-height:44px;padding:6px 16px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.idcard .go a{background:var(--accent);color:#fff;border:0}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:16px 0}
.stat{padding:14px 8px;border:1px solid var(--line);border-radius:10px;background:var(--panel);text-align:center}
.stat .si{width:22px;height:22px;object-fit:contain;display:block;margin:0 auto 6px}
.stat b{display:block;font-size:22px;font-family:Georgia,serif}
.stat span{display:block;margin-top:4px;color:var(--muted);font-size:13px}
.stat a{display:contents}
.sec{margin-top:22px}
.sec h2{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px}
.sec h2 .ico{width:18px;height:18px;object-fit:contain}
.works{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.wk{display:block}
.wk .cv{position:relative;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:#23302d;box-shadow:0 4px 12px rgba(0,0,0,.14)}
.wk .cv img{width:100%;height:100%;object-fit:cover;display:block}
.wk .cv span{position:absolute;inset:0;display:grid;place-items:center;padding:10px;color:#e8e2d5;font-size:13px;text-align:center;line-height:1.5}
.wk b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:8px;font-size:13.5px;line-height:1.4}
.wk small{color:var(--muted);font-size:12.5px}
.ico{width:18px;height:18px;object-fit:contain;vertical-align:-4px}
.sec h2 .n{color:var(--muted);font-size:13px}
.sec h2 button{margin-left:auto;border:0;background:none;color:var(--accent);font-size:13px;cursor:pointer}
.nrow{display:flex;gap:10px;align-items:baseline;padding:10px 14px;margin-bottom:6px;border:1px solid var(--line);border-radius:9px;background:var(--panel);font-size:13.5px}
.nrow.unread{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:color-mix(in srgb,var(--accent) 4%,var(--panel))}
.nrow .nt{color:var(--muted);flex:1;min-width:0}
.nrow .nt b{color:var(--ink)}
.nrow a{flex:none;color:var(--accent);font-size:13px}
.rv{padding:12px 14px;margin-bottom:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.rv .bk{font-size:13px;color:var(--muted)}
.rv .st{color:var(--gold);letter-spacing:2px;font-size:13px}
.rv p{margin:6px 0 0;font-size:14px;line-height:1.65}
.empty{padding:36px 0;color:var(--muted);text-align:center;font-size:14.5px;line-height:2}
.empty a{color:var(--accent)}
@media(max-width:620px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.idcard{grid-template-columns:52px minmax(0,1fr)}.idcard .go{grid-column:1/-1;margin:0;flex-direction:row;flex-wrap:wrap}.works{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
