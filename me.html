<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的主页 · EVORON AI</title>
<style>
:root{--bg:#f4f5f4;--surface:#fff;--panel:#fff;--ink:#202524;--muted:#747b79;--line:#e2e5e3;--green:#079b6b;--green-dark:#087a58;--accent:#079b6b;--accent-dark:#087a58;--gold:#b27a22;--serif:'Songti SC','Noto Serif SC','Source Han Serif SC',Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--sans)}a{color:inherit;text-decoration:none}
.topbar{background:#fff;border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1180px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between}
.topbar .brand{display:inline-flex;align-items:center;gap:10px}
.topbar .brand-mark{height:32px;display:block;mix-blend-mode:multiply}
.topbar .brand-word{font-size:20px;font-weight:800;letter-spacing:.02em;background:linear-gradient(105deg,#123a8c 0%,#1f6fd6 55%,#28b4e8 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.topbar .brand-cn{font-family:var(--serif);font-size:19px;font-weight:800;letter-spacing:.14em;color:var(--ink)}
.topbar-right{display:flex;align-items:center;gap:8px}
.topbar-link{display:inline-flex;align-items:center;min-height:32px;padding:0 12px;border-radius:16px;color:var(--muted);font-size:13px;font-weight:700}
.topbar-link:hover{background:#f2f5f4;color:var(--green-dark)}
.topbar-link.active{background:#eaf4ef;color:var(--green-dark)}
.page-head{max-width:1120px;margin:0 auto;padding:36px 24px 0}
.page-head h1{margin:0;font-family:var(--serif);font-size:31px;line-height:1.4}
.page-head .lede{margin:10px 0 0;color:var(--muted);font-size:13.5px}
@media(max-width:720px){.topbar-inner{padding:0 14px}.topbar .brand-cn{display:none}.topbar-link{padding:0 9px}.page-head{padding:24px 16px 0}.page-head h1{font-size:25px}}
.m-tabbar{display:none}
@media(max-width:640px){
.topbar-link{display:none}
.m-tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:5px 8px calc(5px + env(safe-area-inset-bottom))}
.m-tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:13px;color:var(--muted);font-weight:600}
.m-tabbar a img{width:22px;height:22px;opacity:.6;mix-blend-mode:multiply}
.m-tabbar a.on{color:var(--green-dark)}
.m-tabbar a.on img{opacity:1}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
}
.wrap{max-width:760px;margin:0 auto;padding:22px 18px 76px}
.idcard{display:flex;align-items:center;gap:14px;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-size:22px;font-weight:800;flex:none}
.idcard .nm{font-size:18px;font-weight:800}
.idcard .role{margin-top:3px;color:var(--muted);font-size:13px}
.idcard .go{margin-left:auto;display:flex;flex-direction:column;gap:8px}
.idcard .go a,.idcard .go button{min-height:34px;padding:0 16px;border:1px solid var(--line);border-radius:17px;background:#fff;color:var(--ink);font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.idcard .go a{background:var(--accent);color:#fff;border:0}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:16px 0}
.stat{padding:14px 8px;border:1px solid var(--line);border-radius:10px;background:var(--panel);text-align:center}
.stat .si{width:22px;height:22px;object-fit:contain;display:block;margin:0 auto 6px}
.stat b{display:block;font-size:22px;font-family:Georgia,serif}
.stat span{display:block;margin-top:4px;color:var(--muted);font-size:13px}
.stat a{display:contents}
.sec{margin-top:22px}
.sec h2{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px}
.sec h2 .ico{width:18px;height:18px;object-fit:contain}
.works{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.wk{display:block}
.wk .cv{position:relative;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:#23302d;box-shadow:0 4px 12px rgba(0,0,0,.14)}
.wk .cv img{width:100%;height:100%;object-fit:cover;display:block}
.wk .cv span{position:absolute;inset:0;display:grid;place-items:center;padding:10px;color:#e8e2d5;font-size:13px;text-align:center;line-height:1.5}
.wk b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:8px;font-size:13.5px;line-height:1.4}
.wk small{color:var(--muted);font-size:12.5px}
.ico{width:18px;height:18px;object-fit:contain;vertical-align:-4px}
.sec h2 .n{color:var(--muted);font-size:13px}
.sec h2 button{margin-left:auto;border:0;background:none;color:var(--accent);font-size:13px;cursor:pointer}
.nrow{display:flex;gap:10px;align-items:baseline;padding:10px 14px;margin-bottom:6px;border:1px solid var(--line);border-radius:9px;background:var(--panel);font-size:13.5px}
.nrow.unread{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:color-mix(in srgb,var(--accent) 4%,var(--panel))}
.nrow .nt{color:var(--muted);flex:1;min-width:0}
.nrow .nt b{color:var(--ink)}
.nrow a{flex:none;color:var(--accent);font-size:13px}
.rv{padding:12px 14px;margin-bottom:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.rv .bk{font-size:13px;color:var(--muted)}
.rv .st{color:var(--gold);letter-spacing:2px;font-size:13px}
.rv p{margin:6px 0 0;font-size:14px;line-height:1.65}
.empty{padding:36px 0;color:var(--muted);text-align:center;font-size:14.5px;line-height:2}
.empty a{color:var(--accent)}
@media(max-width:620px){.stats{grid-template-columns:repeat(3,1fr)}.idcard .go{flex-direction:row}.works{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<header class="topbar"><div class="topbar-inner"><a class="brand" href="/index.html"><img class="brand-mark" src="/brand/evoron-mark.png" alt="EVORON AI"><span class="brand-word">EVORON AI</span><span class="brand-cn">书城</span></a><span class="topbar-right"><a class="topbar-link" href="/index.html">书城首页</a><a class="topbar-link" href="/shelf.html">我的书架</a><a class="topbar-link" href="/feed.html">社区动态</a><a class="topbar-link active" href="/me.html">我的主页</a></span></div></header><nav class="m-tabbar" aria-label="站内导航"><a href="/index.html"><img src="/assets/icons/books.png" alt=""><span class="mtb-t">书城</span></a><a href="/shelf.html"><img src="/assets/icons/bookmark.png" alt=""><span class="mtb-t">书架</span></a><a href="/feed.html"><img src="/assets/icons/speech.png" alt=""><span class="mtb-t">动态</span></a><a class="on" href="/me.html"><img src="/assets/icons/person.png" alt=""><span class="mtb-t">我的</span></a></nav><script>(function(){try{if(localStorage.getItem('hai.shelfLang')==='en'){var m={'书城':'Store','书架':'Shelf','动态':'Feed','我的':'Me'};document.querySelectorAll('.m-tabbar .mtb-t').forEach(function(s){if(m[s.textContent])s.textContent=m[s.textContent]})}}catch(e){}})();</script>
<div class="page-head"><h1 data-t="title">我的主页</h1></div>
<div class="wrap">
  <div id="main"><div class="empty" data-t="loading">正在打开…</div></div>
</div>
<script>
(function(){
  var EN=(localStorage.getItem('hai.shelfLang')||((navigator.language||'').toLowerCase().indexOf('zh')===0?'zh':'en'))==='en';
  var T=function(zh,en){return EN?en:zh};
  document.title=T('我的主页 · EVORON AI','My Page · EVORON AI');
  var tmap={title:['我的主页','My page'],back:['← 返回书库','← Library'],shelf:['我的书架','My shelf'],feed:['社区动态','Community'],loading:['正在打开…','Loading…']};
  Object.keys(tmap).forEach(function(k){var el=document.querySelector('[data-t="'+k+'"]');if(el&&EN)el.textContent=tmap[k][1]});
  var main=document.getElementById('main');
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
  function j(u,opt){return fetch(u,Object.assign({credentials:'same-origin'},opt||{})).then(function(r){return r.json()})}
  j('/api/auth/me').then(function(me){
    if(!(me&&me.ok&&me.user)){
      main.innerHTML='';
      var em=el('div','empty');
      em.appendChild(document.createTextNode(T('登录后即可看到你的书架、想法与通知。','Sign in to see your shelf, thoughts and notifications.')));
      em.appendChild(document.createElement('br'));
      var a=el('a','',T('回书库登录','Sign in from the library'));a.href='/index.html';
      em.appendChild(a);
      main.appendChild(em);
      return;
    }
    var u=me.user;
    main.innerHTML='';
    var card=el('div','idcard');
    var av=el('div','avatar',(u.penName||u.name||'?').slice(0,1).toUpperCase());
    card.appendChild(av);
    var mid=el('div','');
    mid.appendChild(el('div','nm',u.penName||u.name));
    function remainingCredits(user){if(!user||user.role==='owner')return null;if(user.balance&&user.balance.unlimited)return null;if(user.balance&&user.balance.remaining!=null)return user.balance.remaining;if(user.credits!=null)return user.credits;return null}
    var rem=remainingCredits(u);
    mid.appendChild(el('div','role',(u.role==='owner'?T('超级用户','Owner'):T('读者 · 作者','Reader · Writer'))+(rem!=null&&u.role!=='owner'?(' · '+T('剩余积分 ','Remaining credits ')+rem):'')));
    card.appendChild(mid);
    var go=el('div','go');
    var st=el('a','');st.innerHTML='<img class="ico" src="assets/icons/write-inv.png" alt=""> '+T('进入写作台','Open the studio');st.href='https://write.evoronai.com/';go.appendChild(st);
    var out=el('button','',T('登出','Sign out'));
    out.onclick=function(){j('/api/auth/logout',{method:'POST'}).then(function(){location.reload()})};
    go.appendChild(out);
    card.appendChild(go);
    main.appendChild(card);
    var stats=el('div','stats');main.appendChild(stats);
    function stat(icon,n,label,href){var s2=el('div','stat');var inner=href?el('a',''):s2;var im=document.createElement('img');im.className='si';im.src='assets/icons/'+icon+'.png';im.alt='';var b=el('b','',String(n));var sp=el('span','',label);if(href){inner.href=href;inner.appendChild(im);inner.appendChild(b);inner.appendChild(sp);s2.appendChild(inner)}else{s2.appendChild(im);s2.appendChild(b);s2.appendChild(sp)}stats.appendChild(s2)}
    Promise.all([j('/api/reader/shelf').catch(function(){return null}),j('/api/reader/profile').catch(function(){return null}),j('/api/reader/notifications').catch(function(){return null})]).then(function(rs){
      var shelf=rs[0]&&rs[0].ok?rs[0]:{counts:{wishlist:0,reading:0,finished:0}};
      var prof=(rs[1]&&rs[1].ok&&rs[1].profile)||{};
      var noti=rs[2]&&rs[2].ok?rs[2]:{items:[],unread:0};
      var works=(prof.works||[]);
      stat('bookmark',shelf.counts.wishlist,T('想读','Want'), '/index.html#myshelf-wishlist');
      stat('book',shelf.counts.reading,T('在读','Reading'),'/index.html#myshelf-reading');
      stat('check',shelf.counts.finished,T('读完','Finished'),'/index.html#myshelf-finished');
      stat('speech',prof.notes||0,T('想法','Thoughts'));
      stat('star',prof.reviews||0,T('书评','Reviews'));
      stat('note',works.length,T('作品','Works'),works.length?'#works':'https://write.evoronai.com/');
      if(works.length){
        var wk=el('div','sec');wk.id='works';
        var wh=el('h2','');wh.innerHTML='<img class="ico" src="assets/icons/note.png" alt=""> '+T('我的作品','My works');
        var wn=el('span','n',works.length+T(' 部',' published'));wh.appendChild(wn);
        wk.appendChild(wh);
        var wg=el('div','works');
        // v5.71 用户实弹：作品最多显示 12 部——首屏 12 部 + 「展开全部」补渲余下
        var WORKS_FOLD=12;
        function renderWork(w){
          var a2=el('a','wk');a2.href='/'+(w.url||('books/'+w.projectId+'/index.html'));
          var cv=el('div','cv');
          if(w.coverUrl){var ci=document.createElement('img');ci.src='/'+w.coverUrl;ci.alt='';cv.appendChild(ci)}
          else{cv.appendChild(el('span','',w.title||''))}
          a2.appendChild(cv);
          a2.appendChild(el('b','',w.title||''));
          a2.appendChild(el('small','',(w.category||'')+(w.chapterCount?' · '+w.chapterCount+T(' 章',' ch.'):'')));
          wg.appendChild(a2);
        }
        works.slice(0,WORKS_FOLD).forEach(renderWork);
        wk.appendChild(wg);
        if(works.length>WORKS_FOLD){
          var more=el('button','', T('展开全部 '+works.length+' 部','Show all '+works.length));
          more.style.cssText='margin:12px auto 0;display:block;border:1px solid var(--line);border-radius:17px;background:#fff;padding:7px 22px;font-size:13px;cursor:pointer;color:var(--ink)';
          more.onclick=function(){works.slice(WORKS_FOLD).forEach(renderWork);more.remove()};
          wk.appendChild(more);
        }
        main.appendChild(wk);
      }
      var items=noti.rows||[];
      var sec=el('div','sec');
      var h=el('h2','');h.innerHTML='<img class="ico" src="assets/icons/bell.png" alt=""> '+T('通知','Notifications');
      var n2=el('span','n',(noti.unread||0)+T(' 未读',' unread'));h.appendChild(n2);
      if(items.length){var rd=el('button','',T('全部已读','Mark all read'));rd.onclick=function(){j('/api/reader/notifications',{method:'POST'}).then(function(){location.reload()})};h.appendChild(rd)}
      sec.appendChild(h);
      if(!items.length)sec.appendChild(el('div','empty',T('暂无通知','No notifications yet')));
      items.slice(0,20).forEach(function(it){
        var r=el('div','nrow'+(it.read?'':' unread'));
        var t2=el('span','nt');t2.innerHTML='';
        var b2=el('b','',it.fromName||'');t2.appendChild(b2);
        var verb=it.type==='like'?T(' 赞了你',' liked your '):T(' 回复了你',' replied to your ');
        t2.appendChild(document.createTextNode(verb+(EN?({note:'thought',review:'review',reply:'reply'})[it.kind]||'':({note:'的想法',review:'的书评',reply:'的回复'})[it.kind]||'')+(it.bookTitle?' · '+it.bookTitle:'')+(it.text?'：'+it.text:'')));
        r.appendChild(t2);
        if(it.bookId){var g=el('a','',T('去看看','View'));g.href='/books/'+it.bookId+'/index.html';r.appendChild(g)}
        sec.appendChild(r);
      });
      main.appendChild(sec);
      var recent=(prof.recentReviews||[]);
      var sec2=el('div','sec');
      var h3=el('h2','');h3.innerHTML='<img class="ico" src="assets/icons/star.png" alt=""> '+T('我的最近书评','My recent reviews');sec2.appendChild(h3);
      if(!recent.length)sec2.appendChild(el('div','empty',T('还没写过书评——读完一本书去末章打分吧。','No reviews yet — finish a book and rate it.')));
      recent.slice(0,5).forEach(function(rv){
        var d=el('div','rv');
        var bk=el('div','bk',rv.bookTitle||T('（书目已下架）','(removed book)'));
        var st2=el('span','st','★★★★★'.slice(0,rv.rating||0));
        d.appendChild(bk);d.appendChild(st2);
        if(rv.text)d.appendChild(el('p','',rv.text));
        d.onclick=function(){if(rv.bookId)location.href='/books/'+rv.bookId+'/index.html'};
        sec2.appendChild(d);
      });
      main.appendChild(sec2);
    });
  }).catch(function(){main.innerHTML='<div class="empty">'+T('页面暂时打不开。','Temporarily unavailable.')+'</div>'});
})();
</script></body></html>
