<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><meta name="referrer" content="no-referrer">
<title>双重认证 · EVORON AI</title>
<link rel="stylesheet" href="assets/admin-security.css?v=6.24.17">
</head><body>
<header><a href="/account.html?tab=security"><img src="brand/evoron-mark.png" width="28" height="28" alt="">EVORON AI</a><a href="/account.html?tab=security" data-zh="账号安全" data-en="Account security">账号安全</a></header>
<main>
  <h1 data-zh="双重认证" data-en="Two-factor authentication">双重认证</h1>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="settings" hidden>
    <p id="summary"></p>
    <form id="startForm">
      <label><span data-zh="操作" data-en="Action">操作</span><select id="operation"></select></label>
      <label><span data-zh="当前密码" data-en="Current password">当前密码</span><input id="currentPassword" type="password" required autocomplete="current-password"></label>
      <label id="currentCodeField" hidden><span data-zh="动态验证码或恢复码" data-en="Authenticator code or recovery code">动态验证码或恢复码</span><input id="currentCode" autocomplete="one-time-code" maxlength="35" spellcheck="false"></label>
      <button type="submit" data-zh="继续" data-en="Continue">继续</button>
    </form>
  </section>
  <section id="enrollment" hidden>
    <h2 data-zh="绑定验证器" data-en="Enroll authenticator">绑定验证器</h2>
    <img id="qr" alt="" width="240" height="240">
    <label><span data-zh="手动设置密钥" data-en="Manual setup key">手动设置密钥</span><input id="setupKey" readonly translate="no" autocomplete="off" spellcheck="false"></label>
    <form id="confirmForm">
      <label><span data-zh="当前密码" data-en="Current password">当前密码</span><input id="confirmPassword" type="password" required autocomplete="current-password"></label>
      <label><span data-zh="新验证器动态码" data-en="New authenticator code">新验证器动态码</span><input id="confirmCode" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label>
      <button type="submit" data-zh="确认绑定" data-en="Confirm enrollment">确认绑定</button>
    </form>
  </section>
  <section id="complete" hidden>
    <h2 data-zh="认证设置已更新" data-en="Authentication updated">认证设置已更新</h2>
    <div id="recovery" hidden>
      <p data-zh="恢复码仅显示一次。请离线安全保存，每条只能使用一次；不要分享。" data-en="Recovery codes are shown once. Store them securely offline. Each code works once; do not share them.">恢复码仅显示一次。请离线安全保存，每条只能使用一次；不要分享。</p>
      <textarea id="recoveryCodes" readonly rows="8" translate="no" autocomplete="off" spellcheck="false" aria-label="Recovery codes"></textarea>
      <a id="download" download="evoron-recovery-codes.txt" data-zh="下载恢复码" data-en="Download recovery codes">下载恢复码</a>
      <label class="ack"><input id="saved" type="checkbox"><span data-zh="我已安全保存恢复码" data-en="I have securely saved my recovery codes">我已安全保存恢复码</span></label>
    </div>
    <a id="signIn" href="/login.html?returnTo=%2Fadmin-security.html" data-zh="重新登录" data-en="Sign in again">重新登录</a>
  </section>
</main>
<script src="assets/admin-security.js?v=6.24.17"></script>
</body></html>
